<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8faf8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%assets/Glossy%20Minecraft%20Slime%20Mod%20Manager-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%BASE_URL%assets/Glossy%20Minecraft%20Slime%20Mod%20Manager-16x16.png" />
    <link
      rel="preload"
      href="%BASE_URL%assets/fonts/minecraft_font.ttf"
      as="font"
      type="font/ttf"
      crossorigin />
    <title>MC Mod Manager</title>
    <script>
      // Apply a saved dark theme before first paint; light is the default.
      try {
        if (localStorage.getItem("mc-mod-manager:theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#0b0f0e");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
